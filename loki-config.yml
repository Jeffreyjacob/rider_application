auth_enabled: false

server:
  http_listen_port: 3100

# ─── Where to store log data ──────────────────────────────────
# In production, you'd use S3/GCS. For dev, filesystem is fine.
common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# ─── Schema: how logs are indexed and stored ──────────────────
# This tells Loki how to split your logs into chunks and index them.
# "tsdb" is the modern, performant index type.
schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# ─── Limits: prevent Loki from eating all your RAM ────────────
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days — discard logs older than this
  max_query_series: 5000

# ─── Storage: keep chunks manageable ──────────────────────────
chunk_store_config:
  max_look_back_period: 0s

# ─── Compaction: clean up old data ────────────────────────────
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# ─── Ruler: for alerting rules (optional, we'll use later) ────
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://localhost:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true
